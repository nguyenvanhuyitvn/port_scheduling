[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scheduling-coursework"
version = "2.0.0"
description = "Reproducible berth and time-invariant specific quay crane scheduling experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.9,<4", "pandas>=2.2,<3", "streamlit>=1.67,<2"]

[project.optional-dependencies]
gurobi = ["gurobipy>=11,<14"]

[project.scripts]
port-schedule = "port_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
